name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gates the whole src/ tree — a restored `@ts-nocheck` would silence tsc,
      # but the ban-ts-comment lint rule below fails the build instead.
      - name: Type check
        run: npx tsc -b --force

      - name: Lint (includes typescript/ban-ts-comment)
        run: npm run lint

      - name: Rules-of-hooks scan
        run: npm run check:hooks

      - name: Tests
        run: npm run test
